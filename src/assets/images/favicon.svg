<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- 7.5: favicon.

         Фон - плоской фиолетовый #CF8BFF из logo.png, тот же, что и в
         логотипе. Градиента нет намеренно: в logo.png его нет тоже,
         заливка плоская по всему квадрату, и добавленный градиент был бы
         придуманным цветом, которого на сайте нигде нет.

         Буква A собрана из трёх фигур - две наклонные ножки и
         перекладина, - а не одним контуром. Контур в таком размере
         (16px в панели вкладок, 32px в списке закладок) превращается в
         кашу из двух пиксельных полос: неясно, где ножка, где
         просвет. Три залитые фигуры при любом масштабе остаются тремя
         фигурами.

         Цвет буквы чёрный, как в логотипе. На #CF8BFF контраст
         достаточный, а белый на фиолетовом был бы светлее оригинала.

         viewBox 32x32, а не 24x24 как у иконок конфигуратора: там
         сетка рассчитана на штрих 1.5, здесь заливка без обводки и
         квадрат должен быть плотным. -->
    <rect width="32" height="32" rx="6" fill="#CF8BFF"/>

    <!-- левая ножка: верхний край правее нижнего, поэтому A наклонена влево -->
    <path d="M6.8 25 L13.6 7.6 L17.4 7.6 L11.2 25 Z"/>
    <!-- правая ножка, зеркально -->
    <path d="M14.6 7.6 L18.4 7.6 L25.2 25 L20.8 25 Z"/>
    <!-- перекладина: шире просвета между ножками, иначе её не видно -->
    <rect x="12.4" y="17.2" width="7.2" height="3.2"/>
</svg>