services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop_db}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Stage 10: схему и минимальные данные создаёт scripts/migrate.php
      # из php-контейнера при старте. Legacy-путь для «всё сразу»:
      # docker compose exec -T db mysql ... < src/scripts/legacy_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
   
  php:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8080/')?0:1);"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Имя базы берётся из .env, а не пишется здесь дважды: раньше
      # MYSQL_DATABASE и DB_NAME были захардкожены по отдельности, и
      # смена имени в .env не давала ничего - compose читал своё
      # значение. Теперь источник один, и переименование базы сводится
      # к правке одной строки в .env.
      DB_NAME: ${MYSQL_DATABASE:-shop_db}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 5-d-3: непустое значение включает счётчик запросов к базе,
      # он печатается в подвале страницы. По умолчанию выключено.
      DEBUG_SQL_COUNT: ${DEBUG_SQL_COUNT:-}
      # Stage 10: 1 = залить демо-компоненты при старте (seed_components.php)
      SEED_DATA: ${SEED_DATA:-0}

volumes:
  mysql_data:
